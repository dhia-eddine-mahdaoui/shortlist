<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img class="brand" src="icon.png" alt="Shortlist">
    <label class="search">
      <svg viewBox="0 0 16 16"><path d="M11.2 10.1 15 13.9l-1.1 1.1-3.8-3.8a6 6 0 1 1 1.1-1.1ZM6.5 11a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z"/></svg>
      <input id="q" placeholder="Search title, company, skill" autocomplete="off" spellcheck="false">
    </label>
    <nav class="nav" id="nav">
      <button data-view="jobs" class="on">
        <svg viewBox="0 0 24 24"><path d="M17 6V5a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3v1H2v4a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V6h-5ZM9 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1H9V5Zm10 10a4 4 0 0 0 3-1.4V19a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-5.4A4 4 0 0 0 5 15h14Z"/></svg>
        <span>Jobs</span><i class="badge" id="badge" hidden></i>
      </button>
      <button data-view="pipeline">
        <svg viewBox="0 0 24 24"><path d="M3 3h5v18H3V3Zm6.5 0h5v12h-5V3ZM16 3h5v8h-5V3Z"/></svg>
        <span>Pipeline</span>
      </button>
      <button data-view="ideas">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2Zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1Z"/></svg>
        <span>Ideas</span>
      </button>
      <button data-view="profile">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z"/></svg>
        <span>Profile</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24"><path d="M21 13.6v-3.2l-2.4-.6a7 7 0 0 0-.7-1.7l1.3-2.1-2.2-2.3-2.2 1.3a7 7 0 0 0-1.7-.7L12.6 2H9.4l-.6 2.3a7 7 0 0 0-1.7.7L5 3.7 2.7 6l1.3 2.1a7 7 0 0 0-.7 1.7L1 10.4v3.2l2.3.6c.2.6.4 1.2.7 1.7L2.7 18 5 20.3l2.1-1.3c.5.3 1.1.5 1.7.7l.6 2.3h3.2l.6-2.3c.6-.2 1.2-.4 1.7-.7l2.2 1.3 2.2-2.3-1.3-2.1c.3-.5.5-1.1.7-1.7l2.4-.6ZM11 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
    <div class="conn" id="conn" title="">
      <span class="dot"></span><span id="conn-text">Chrome</span>
    </div>
  </div>
</header>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="chips" id="chips"></div>
    <span class="grow"></span>
    <button class="btn primary" id="scan-btn">
      Scan LinkedIn
      <svg viewBox="0 0 16 16" class="caret"><path d="m8 11 4-5H4l4 5Z"/></svg>
    </button>
  </div>
</div>

<div class="scanline" id="scanline" hidden>
  <div class="scanline-in">
    <div class="progress"><i id="scan-fill"></i></div>
    <span id="scan-text"></span>
    <button class="link" id="scan-cancel">Cancel</button>
    <button class="link" id="scan-close" hidden>Dismiss</button>
  </div>
</div>

<main class="view jobs" id="view-jobs">
  <section class="list card" id="list"></section>
  <section class="detail card" id="detail"></section>
</main>
<main class="view board-wrap" id="view-pipeline" hidden></main>
<main class="view page" id="view-ideas" hidden></main>
<main class="view page" id="view-profile" hidden></main>
<main class="view page" id="view-settings" hidden></main>

<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
