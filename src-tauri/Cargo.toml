[package]
name = "shortlist"
version = "0.1.1"
description = "Job-search CRM that AI assistants fill through MCP"
edition = "2021"
rust-version = "1.89"
authors = ["Dhia Mahdaoui"]
publish = false

[lib]
name = "shortlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
