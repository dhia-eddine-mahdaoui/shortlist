<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; font: 14px -apple-system, system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: rgba(0,0,0,.9); background: #fff; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #e8e8e8; font-weight: 600; }
  header img { width: 20px; height: 20px; border-radius: 4px; }
  main { padding: 12px 16px 16px; }
  .state { display: flex; align-items: center; gap: 8px; color: rgba(0,0,0,.6); margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #a0a0a0; }
  .dot.on { background: #0a66c2; }
  .scan { color: rgba(0,0,0,.6); font-size: 13px; min-height: 18px; margin-bottom: 12px; }
  button { width: 100%; height: 34px; border-radius: 17px; border: 1px solid #0a66c2; background: #0a66c2; color: #fff; font-weight: 600; font-size: 14px; font-family: inherit; cursor: pointer; }
  button:hover { background: #004182; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 10px; font-size: 13px; color: rgba(0,0,0,.6); min-height: 18px; }
</style>
</head>
<body>
  <header><img src="icon48.png" alt="">Shortlist</header>
  <main>
    <div class="state"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>
    <div class="scan" id="scan"></div>
    <button id="add">Add this job to Shortlist</button>
    <div class="msg" id="msg"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
